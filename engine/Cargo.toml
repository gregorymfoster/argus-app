[package]
name = "argus-engine"
version = "0.0.1"
edition = "2021"
license = "MIT"
# One integration-test binary (tests/main.rs) instead of one per file: see that file.
autotests = false

[[test]]
name = "engine"
path = "tests/main.rs"

[dependencies]
tempfile = "3"
rawler = "0.8"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
blake3 = "1"
flate2 = "1"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
libc = "0.2"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff"] }
tract-onnx = "0.23"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
jpeg-encoder = "0.7.1"
png = "0.17"
tempfile = "3"
sha2 = "0.10"

