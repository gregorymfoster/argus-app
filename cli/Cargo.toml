[package]
name = "argus-cli"
version = "0.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
argus-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
png = "0.17"
rayon = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
tempfile = "3"
# The tests' client features are on here too, so `cargo build -p argus-cli` reuses what
# `cargo test --workspace` built: differing features re-hash tokio, libc and ~15 crates above them (4 min cold).
rmcp = { version = "3.5.1", features = ["server", "transport-io", "client", "transport-child-process"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "process"] }
base64 = "0.22"

[dev-dependencies]
jpeg-encoder = "0.7.1"
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process"] }
